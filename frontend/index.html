 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carecom - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2rem;
      color: #333;
    }

    .doctor-container {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .doctor-card {
      background-color: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 220px;
      text-align: center;
    }

    .doctor-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 1rem;
    }

    .doctor-card h3 {
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
      color: #222;
    }

    .doctor-card p {
      color: #555;
      font-size: 0.95rem;
    }

    .login-box {
      background-color: #fff;
      padding: 1.5rem 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .login-box a {
      display: inline-block;
      margin: 0.5rem 1rem;
      padding: 0.6rem 1.5rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }

    .login-box a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Our Top Doctors</h1>

  <div class="doctor-container">
    <div class="doctor-card">
      <img src="https://i.pravatar.cc/100?img=20" alt="Dr. Trisha panday">
      <h3>Dr. Trisha Panday</h3>
      <p>Cardiologist</p>
    </div>
    <div class="doctor-card">
      <img src="https://i.pravatar.cc/100?img=15" alt="Dr. Anish Yadav">
      <h3>Dr. Anish Yadav</h3>
      <p>Dermatologist</p>
    </div>
    <div class="doctor-card">
      <img src="https://br.web.img2.acsta.net/pictures/19/04/29/20/14/1886009.jpg" alt="Dr.  Mega Fox">
      <h3>Dr. Mega Fox</h3>
      <p>Pediatrician</p>
    </div>
  </div>

  <div class="login-box">
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </div>

</body>
</html>
